<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kas Sistemi 3D</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0d0f14;
    font-family:sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #c{display:block;width:100%;height:100%;}
  #ui{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 14px 14px;
    background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;pointer-events:none;}
  #kas{font-size:18px;font-weight:bold;}
  #bilgi{font-size:13px;opacity:.85;margin-top:2px;line-height:1.3;}
  #yazi{position:absolute;top:8px;left:0;right:0;text-align:center;color:#fff;opacity:.55;
    font-size:12px;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.8);}
  #legends{position:absolute;top:52px;left:8px;pointer-events:none;opacity:.92;
    background:rgba(0,0,0,.35);border-radius:8px;padding:6px 8px;}
  .lg{display:flex;align-items:center;font-size:11px;color:#eee;margin-bottom:2px;}
  .sw{width:12px;height:12px;border-radius:2px;margin-right:6px;flex:none;}
</style>
</head>
<body>
<div id="c"></div>
<div id="yazi">☝️ Sürükle = döndür · İki parmak/tekerlek = yakınlaştır · Kasa dokun = detay</div>
<div id="ui"><div id="kas">İnsan Kas Sistemi — 3D</div><div id="bilgi">Modeli döndür, bir kasa dokunarak geliştirme rehberini aç.</div></div>
<div id="legends"></div>
<script src="three.min.js"></script>
<script>
(function(){
  function kasSecildi(kod, ad){
    document.getElementById('kas').textContent = ad;
    if(window.AndroidBridge && window.AndroidBridge.kasSecildi){ window.AndroidBridge.kasSecildi(kod); }
  }

  // ---------- Renderer ----------
  var w=window.innerWidth, h=window.innerHeight;
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(w,h);
  renderer.setClearColor(0x0d0f14);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  document.getElementById('c').appendChild(renderer.domElement);

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(38,w/h,0.1,100);
  camera.position.set(0,0.5,5.6);
  camera.lookAt(0,0.4,0);

  // ---------- Işıklar (gerçekçi) ----------
  var hemi=new THREE.HemisphereLight(0xbdd7ff,0x3a3226,0.75); scene.add(hemi);
  var amb=new THREE.AmbientLight(0xffffff,0.18); scene.add(amb);
  var key=new THREE.DirectionalLight(0xfff2e0,1.15); key.position.set(2.5,4,4); key.castShadow=true;
  key.shadow.mapSize.width=1024; key.shadow.mapSize.height=1024; scene.add(key);
  var rim=new THREE.DirectionalLight(0x4a6cff,0.5); rim.position.set(-3,-1,3); scene.add(rim);
  var fill=new THREE.DirectionalLight(0xffffff,0.22); fill.position.set(-1,1,-2); scene.add(fill);

  // ---------- Renkler ----------
  var R={
    neck:0xC97B4A,traps:0xB8860B,shoulders:0xE07B39,chest:0xE5533D,
    abdominals:0xD48A32,biceps:0x2E86AB,triceps:0x3D8B96,forearms:0x6A8CAF,
    lats:0x7B5EA7,"middle back":0x8E6C88,"lower back":0xA66A46,glutes:0xC05A7A,
    quadriceps:0x4C9A5B,hamstrings:0x5B8C5A,calves:0x7BA05B,
    abductors:0xB08C3B,adductors:0x9C6B93
  };
  var TR={
    neck:"Boyun",traps:"Trapez",shoulders:"Omuz",chest:"Göğüs",abdominals:"Karın",
    biceps:"Biceps",triceps:"Triceps",forearms:"Ön Kol",lats:"Sırt Kanadı",
    "middle back":"Orta Sırt","lower back":"Bel",glutes:"Kalça",
    quadriceps:"Ön Bacak",hamstrings:"Arka Bacak",calves:"Baldır",
    abductors:"Kaçıranlar",adductors:"Yaklaştırıcılar"
  };
  var secili=null, secilenOklar=[];
  var group=new THREE.Group(); scene.add(group);

  function mat(kod){ return new THREE.MeshStandardMaterial({
    color:R[kod],roughness:0.62,metalness:0.05 }); }

  // ---------- Yardımcılar ----------
  // yumuşak kapsül iki nokta arası
  function kasil(a,b,radR,radT,kod){
    var dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
    var geo=new THREE.CylinderGeometry(radT,radR,len,28,1,true);
    var m=new THREE.Mesh(geo,mat(kod));
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
    m.castShadow=true; m.receiveShadow=true; m.userData.kas=kod; return m;
  }
  function kutulu(x,y,z,sx,sy,sz,kod,rx,ry,rz){
    var geo=new THREE.BoxGeometry(sx,sy,sz,8,8,8);
    var m=new THREE.Mesh(geo,mat(kod));
    m.position.set(x,y,z);
    if(rx)m.rotation.x=rx; if(ry)m.rotation.y=ry; if(rz)m.rotation.z=rz;
    m.castShadow=true; m.receiveShadow=true; m.userData.kas=kod; return m;
  }
  function topa(x,y,z,rx,ry,rz,r,kod){
    var m=new THREE.Mesh(new THREE.SphereGeometry(r,28,24),mat(kod));
    m.position.set(x,y,z); m.scale.set(rx,ry,rz);
    m.castShadow=true; m.receiveShadow=true; m.userData.kas=kod; return m;
  }

  // ---------- Ana gövde ----------
  // Boyun + trapez
  group.add(topa(0,1.32,0, 1,0.9,1, 0.13,'neck'));
  group.add(kutulu(0,1.12,0.04, 0.72,0.32,0.60,'traps',0.12,0,0));
  // Göğüs — iki parça (pektoral)
  group.add(kutulu(-0.26,0.60,0.10, 0.55,0.52,0.34,'chest',0,0.08,0.18));
  group.add(kutulu(0.26,0.60,0.10, 0.55,0.52,0.34,'chest',0,-0.08,0.18));
  // Karın — 6 paket
  for(var satir=0;satir<3;satir++){
    var y=0.22-satir*0.12;
    group.add(kutulu(-0.13,y,0.18, 0.22,0.10,0.16,'abdominals'));
    group.add(kutulu(0.13,y,0.18, 0.22,0.10,0.16,'abdominals'));
  }
  // Omuzlar (deltoid)
  group.add(topa(-0.46,1.10,0.05, 0.42,0.30,0.40, 0.30,'shoulders'));
  group.add(topa(0.46,1.10,0.05, 0.42,0.30,0.40, 0.30,'shoulders'));

  // ---- Kollar ----
  // Üst kol: biceps (ön) + triceps (arka) + lateral
  (function(s){
    var a=new THREE.Vector3(-0.62*s,1.02,0.04), b=new THREE.Vector3(-0.82*s,0.48,0.02);
    var m=kasil(a,b,0.14,0.12,'biceps'); m.rotation.z=0.15*s; group.add(m);
    var a2=new THREE.Vector3(-0.60*s,1.02,-0.07), b2=new THREE.Vector3(-0.80*s,0.48,-0.05);
    var m2=kasil(a2,b2,0.12,0.10,'triceps'); m2.rotation.z=0.15*s; group.add(m2);
    // Ön kol
    var a3=new THREE.Vector3(-0.85*s,0.46,0), b3=new THREE.Vector3(-0.97*s,-0.05,0);
    var m3=kasil(a3,b3,0.09,0.07,'forearms'); group.add(m3);
  })(1);
  (function(s){
    var a=new THREE.Vector3(-0.62*s,1.02,0.04), b=new THREE.Vector3(-0.82*s,0.48,0.02);
    var m=kasil(a,b,0.14,0.12,'biceps'); m.rotation.z=0.15*s; group.add(m);
    var a2=new THREE.Vector3(-0.60*s,1.02,-0.07), b2=new THREE.Vector3(-0.80*s,0.48,-0.05);
    var m2=kasil(a2,b2,0.12,0.10,'triceps'); m2.rotation.z=0.15*s; group.add(m2);
    var a3=new THREE.Vector3(-0.85*s,0.46,0), b3=new THREE.Vector3(-0.97*s,-0.05,0);
    var m3=kasil(a3,b3,0.09,0.07,'forearms'); group.add(m3);
  })(-1);

  // ---- Bacaklar ----
  (function(s){
    // Kalça
    var hiz=0.60;
    // Ön bacak (quad)
    var a=new THREE.Vector3(-0.28*s,-0.30,0.05), b=new THREE.Vector3(-0.28*s,-1.00,0.02);
    var m=kasil(a,b,0.19,0.15,'quadriceps'); group.add(m);
    // Arka bacak (hamstring)
    var a2=new THREE.Vector3(-0.28*s,-0.30,-0.07), b2=new THREE.Vector3(-0.28*s,-1.00,-0.04);
    var m2=kasil(a2,b2,0.15,0.12,'hamstrings'); group.add(m2);
    // Baldır
    var a3=new THREE.Vector3(-0.28*s,-1.03,0), b3=new THREE.Vector3(-0.28*s,-1.62,0);
    var m3=kasil(a3,b3,0.10,0.08,'calves'); group.add(m3);
    // Kaçıranlar
    var a4=new THREE.Vector3(-0.40*s,-0.40,0.06), b4=new THREE.Vector3(-0.46*s,-0.72,0.02);
    var m4=kasil(a4,b4,0.08,0.06,'abductors'); group.add(m4);
  })(1);
  (function(s){
    var a=new THREE.Vector3(-0.28*s,-0.30,0.05), b=new THREE.Vector3(-0.28*s,-1.00,0.02);
    var m=kasil(a,b,0.19,0.15,'quadriceps'); group.add(m);
    var a2=new THREE.Vector3(-0.28*s,-0.30,-0.07), b2=new THREE.Vector3(-0.28*s,-1.00,-0.04);
    var m2=kasil(a2,b2,0.15,0.12,'hamstrings'); group.add(m2);
    var a3=new THREE.Vector3(-0.28*s,-1.03,0), b3=new THREE.Vector3(-0.28*s,-1.62,0);
    var m3=kasil(a3,b3,0.10,0.08,'calves'); group.add(m3);
    var a4=new THREE.Vector3(-0.40*s,-0.40,0.06), b4=new THREE.Vector3(-0.46*s,-0.72,0.02);
    var m4=kasil(a4,b4,0.08,0.06,'abductors'); group.add(m4);
  })(-1);
  // Kalça kasları (glutes)
  group.add(kutulu(0,-0.32,0.02, 0.92,0.30,0.60,'glutes',0.06,0,0));

  // ---- Sırt (arka) ----
  group.add(kutulu(0,0.58,-0.26, 0.98,0.90,0.18,'lats',0,0,0.04));
  group.add(kutulu(0,0.14,-0.26, 0.86,0.55,0.16,'middle back',0,0,0.04));
  group.add(kutulu(0,-0.10,-0.26, 0.82,0.34,0.16,'lower back',0,0,0.04));

  // Kafa (görsel — kas değil)
  var kafa=new THREE.Mesh(new THREE.SphereGeometry(0.28,32,28),
    new THREE.MeshStandardMaterial({color:0xE2B98A,roughness:0.55}));
  kafa.position.y=1.55; kafa.castShadow=true; group.add(kafa);

  // Zemin (yumuşak gölge alanı)
  var zemin=new THREE.Mesh(new THREE.CircleGeometry(2.4,48),
    new THREE.MeshStandardMaterial({color:0x1a1d24,roughness:0.9}));
  zemin.rotation.x=-Math.PI/2; zemin.position.y=-1.68; zemin.receiveShadow=true; scene.add(zemin);

  group.rotation.x=0.04;

  // ---------- Lejant ----------
  var lg=document.getElementById('legends');
  Object.keys(R).forEach(function(k){
    var d=document.createElement('div');d.className='lg';
    d.innerHTML='<div class="sw" style="background:#'+k.toString(16).padStart(6,'0')+'"></div>'+TR[k];
    lg.appendChild(d);
  });

  // ---------- Orbit (elle) ----------
  var aktif=false,x=0,y=0, teker=5.6;
  var el=renderer.domElement;
  el.addEventListener('touchstart',function(e){if(e.touches.length===1){aktif=true;x=e.touches[0].clientX;y=e.touches[0].clientY;}else if(e.touches.length>=2){aktif=false;}},{passive:true});
  el.addEventListener('touchmove',function(e){if(aktif&&e.touches.length===1){group.rotation.y+=(e.touches[0].clientX-x)*0.012;group.rotation.x+=(e.touches[0].clientY-y)*0.012;group.rotation.x=Math.max(-0.6,Math.min(0.9,group.rotation.x));x=e.touches[0].clientX;y=e.touches[0].clientY;}else if(e.touches.length===2){var oldD=Math.hypot(x-e.touches[0].clientX,0);}},{passive:true});
  el.addEventListener('touchend',function(){aktif=false;},{passive:true});
  el.addEventListener('wheel',function(e){teker=Math.max(3,Math.min(10,teker+e.deltaY*0.005));},{passive:true});

  // ---------- Raycast ile kas seçimi ----------
  var raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
  function dokun(clientX,clientY){
    var rect=el.getBoundingClientRect();
    pointer.x=((clientX-rect.left)/rect.width)*2-1;
    pointer.y=-(((clientY-rect.top)/rect.height)*2-1);
    raycaster.setFromCamera(pointer,camera);
    var meshes=[]; group.traverse(function(o){if(o.isMesh&&o.userData.kas)meshes.push(o);});
    var hits=raycaster.intersectObjects(meshes,false);
    if(hits.length>0) sec(hits[0].object.userData.kas);
  }
  el.addEventListener('click',function(e){ if(e.clientX!==undefined) dokun(e.clientX,e.clientY); });

  function sec(kod){
    if(secili){
      secili.material.color.setHex(secili._renk);
      secili.material.emissive.setHex(0x000000);
    }
    secilenOklar.forEach(function(o){group.remove(o);}); secilenOklar=[];
    var hedef=null;
    group.traverse(function(o){if(o.isMesh&&o.userData.kas===kod&&!hedef)hedef=o;});
    if(!hedef)return;
    hedef._renk=hedef.material.color.getHex();
    hedef.material.color.setHex(0xFF5252);
    hedef.material.emissive.setHex(0x551111);
    secili=hedef;
    var nokta=new THREE.Mesh(new THREE.SphereGeometry(0.06,16,12),
      new THREE.MeshBasicMaterial({color:0xFFD54A}));
    nokta.position.copy(hedef.position); nokta.position.x+=0.28;
    group.add(nokta); secilenOklar.push(nokta);
    kasSecildi(kod, TR[kod]);
  }

  // ---------- Animasyon ----------
  function anim(){
    requestAnimationFrame(anim);
    camera.position.z=teker;
    camera.lookAt(0,0.4,0);
    renderer.render(scene,camera);
  }
  anim();
  window.addEventListener('resize',function(){
    w=window.innerWidth;h=window.innerHeight;
    renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  });
})();
</script>
</body>
</html>
