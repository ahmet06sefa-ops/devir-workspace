<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kas Sistemi 3D — Ayrık Görünüm</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0d11;
    font-family:sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #c{display:block;width:100%;height:100%;}
  #ui{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 14px 14px;
    background:linear-gradient(transparent,rgba(0,0,0,.92));color:#fff;pointer-events:none;}
  #kas{font-size:18px;font-weight:bold;}
  #bilgi{font-size:13px;opacity:.85;margin-top:2px;line-height:1.3;}
  #yazi{position:absolute;top:8px;left:0;right:0;text-align:center;color:#fff;opacity:.55;
    font-size:12px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.85);}
  #legends{position:absolute;top:52px;left:8px;pointer-events:none;opacity:.95;
    background:rgba(0,0,0,.42);border-radius:8px;padding:6px 8px;max-height:55%;overflow:auto;}
  .lg{display:flex;align-items:center;font-size:11px;color:#eee;margin-bottom:2px;}
  .sw{width:12px;height:12px;border-radius:2px;margin-right:6px;flex:none;}
  #kontrol{position:absolute;top:52px;right:8px;display:flex;flex-direction:column;gap:6px;}
  .btn{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:20px;
    padding:8px 14px;font-size:13px;cursor:pointer;font-weight:bold;
    box-shadow:0 1px 4px rgba(0,0,0,.4);}
  .btn.aktif{background:#ff5252;}
</style>
</head>
<body>
<div id="c"></div>
<div id="yazi">☝️ Sürükle = döndür · İki parmak/tekerlek = yakınlaştır · Kasa dokun = detay</div>
<div id="kontrol">
  <button id="btnAyrık" class="btn">🧩 Kasları Ayır</button>
  <button id="btnOn" class="btn">Ön</button>
  <button id="btnArka" class="btn">Arka</button>
</div>
<div id="ui"><div id="kas">İnsan Kas Sistemi — 3D</div><div id="bilgi">"Kasları Ayır" ile her kası tek tek gör, kasa dokunarak rehberi aç.</div></div>
<div id="legends"></div>
<script src="three.min.js"></script>
<script>
(function(){
  function kasSecildi(kod,ad){document.getElementById('kas').textContent=ad;
    if(window.AndroidBridge&&window.AndroidBridge.kasSecildi)window.AndroidBridge.kasSecildi(kod);}

  var w=window.innerWidth,h=window.innerHeight;
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(w,h);renderer.setClearColor(0x0b0d11);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
  document.getElementById('c').appendChild(renderer.domElement);

  var scene=new THREE.Scene();
  // Sahnede hafif bir sis — derinlik ve atmosfer hissi
  scene.fog=new THREE.Fog(0x0b0d11,9,16);
  var camera=new THREE.PerspectiveCamera(38,w/h,0.1,100);
  camera.position.set(0,0.5,6.2);camera.lookAt(0,0.4,0);

  // Gerçekçi çoklu ışık: hemisfer + vurgu + kenar + dolgu
  var hemi=new THREE.HemisphereLight(0xdfe8ff,0x2a2620,0.9);scene.add(hemi);
  scene.add(new THREE.AmbientLight(0xffffff,0.12));
  var key=new THREE.DirectionalLight(0xfff0dd,1.35);key.position.set(3,5,4);key.castShadow=true;
  key.shadow.mapSize.width=1024;key.shadow.mapSize.height=1024;
  key.shadow.camera.near=0.5;key.shadow.camera.far=12;scene.add(key);
  var rim=new THREE.DirectionalLight(0x5f7dff,0.6);rim.position.set(-3,-1,4);scene.add(rim);
  var fill=new THREE.DirectionalLight(0xffffff,0.25);fill.position.set(-1,1,-2);scene.add(fill);
  var top=new THREE.DirectionalLight(0xffffff,0.18);top.position.set(0,6,0);scene.add(top);

  // Renkler — daha gerçekçi kas tonları (hafif doygun, dokulu)
  var R={
    neck:0xB06A44,traps:0xA3741E,shoulders:0xD06A2E,chest:0xD8492F,abdominals:0xC17B28,
    obliques:0xCC9430,biceps:0x2F7690,triceps:0x367B84,forearms:0x5F7C9B,brachialis:0x35917C,
    lats:0x6E5296,"middle back":0x7F617D,"lower back":0x945D3E,glutes:0xB84F6D,
    quadriceps:0x438B4F,hamstrings:0x4E7C4F,calves:0x6E914F,
    abductors:0xA17C33,adductors:0x8C5E85,chestL:0xD8492F,chestU:0xE05A3D,chestLower:0xC63F26,
    absU:0xC17B28,absL:0xB87225,gluteM:0xA84761
  };
  var TR={
    neck:"Boyun",traps:"Trapez",shoulders:"Omuz",chest:"Göğüs (Pektoral)",abdominals:"Karın",
    obliques:"Oblik (Yan Karın)",biceps:"Biceps",triceps:"Triceps",forearms:"Ön Kol",
    brachialis:"Brakialis",lats:"Sırt Kanadı (Lats)","middle back":"Orta Sırt",
    "lower back":"Bel",glutes:"Kalça (Glute)",quadriceps:"Ön Bacak (Kuadriseps)",
    hamstrings:"Arka Bacak (Hamstring)",calves:"Baldır (Gastroknemius)",
    abductors:"Kaçıranlar",adductors:"Yaklaştırıcılar",
    chestL:"Göğüs (Sol Pektoral)",chestU:"Göğüs (Üst Pektoral)",chestLower:"Göğüs (Alt Pektoral)",
    absU:"Karın (Üst)",absL:"Karın (Alt)",gluteM:"Kalça (Gluteus Medius)"
  };
  var secili=null,oklar=[], ayrik=false, gorunum='on';

  // Ayrık yönleri — merkezden dışa
  var kaslar=[];
  function kas(k,base,yon,ac){kaslar.push({k:k,base:base,yon:yon||[0,0,0],ac:ac||0});}
  kas('neck',[0,1.34,0],[0,0.5,0],0.20);
  kas('traps',[0,1.12,0.04],[0,0.4,0.2],0.25);
  kas('chestL',[-0.26,0.60,0.10],[-0.6,0,0.4],0.35);
  kas('chestU',[0.26,0.60,0.10],[0.6,0,0.4],0.35);
  kas('chestLower',[0,0.42,0.16],[0,-0.4,0.3],0.28);
  kas('abdominals',[0,0.22,0.18],[0,-0.5,0.3],0.30);
  kas('obliques',[-0.30,0.16,0.14],[-0.7,0,0.2],0.30);
  kas('obliques',[0.30,0.16,0.14],[0.7,0,0.2],0.30);
  kas('shoulders',[-0.46,1.10,0.05],[-0.9,0.3,0.1],0.40);
  kas('shoulders',[0.46,1.10,0.05],[0.9,0.3,0.1],0.40);
  kas('biceps',[-0.72,0.78,0.03],[-0.9,0,0.2],0.38);
  kas('biceps',[0.72,0.78,0.03],[0.9,0,0.2],0.38);
  kas('triceps',[-0.72,0.78,-0.06],[-0.9,0,-0.2],0.38);
  kas('triceps',[0.72,0.78,-0.06],[0.9,0,-0.2],0.38);
  kas('brachialis',[-0.72,0.60,0.06],[-0.9,0,0.15],0.35);
  kas('brachialis',[0.72,0.60,0.06],[0.9,0,0.15],0.35);
  kas('forearms',[-0.90,0.24,0],[-1.1,0,0.1],0.42);
  kas('forearms',[0.90,0.24,0],[1.1,0,0.1],0.42);
  kas('quadriceps',[-0.28,-0.65,0.04],[-0.5,0,0.3],0.35);
  kas('quadriceps',[0.28,-0.65,0.04],[0.5,0,0.3],0.35);
  kas('hamstrings',[-0.28,-0.65,-0.05],[-0.5,0,-0.3],0.35);
  kas('hamstrings',[0.28,-0.65,-0.05],[0.5,0,-0.3],0.35);
  kas('calves',[-0.28,-1.30,0],[-0.5,0,0.2],0.35);
  kas('calves',[0.28,-1.30,0],[0.5,0,0.2],0.35);
  kas('glutes',[0,-0.32,0.02],[0,0,0.6],0.40);
  kas('abductors',[-0.43,-0.55,0.05],[-0.8,0,0.2],0.35);
  kas('abductors',[0.43,-0.55,0.05],[0.8,0,0.2],0.35);
  kas('adductors',[-0.12,-0.75,0.08],[-0.3,0,0.2],0.30);
  kas('adductors',[0.12,-0.75,0.08],[0.3,0,0.2],0.30);
  kas('lats',[0,0.58,-0.26],[0,0.3,-0.6],0.38);
  kas('middle back',[0,0.14,-0.26],[0,0.2,-0.6],0.36);
  kas('lower back',[0,-0.10,-0.26],[0,-0.2,-0.6],0.34);
  kas('gluteM',[-0.30,-0.32,0.02],[-0.4,0,0.4],0.30);
  kas('gluteM',[0.30,-0.32,0.02],[0.4,0,0.4],0.30);

  var group=new THREE.Group();scene.add(group);

  // Kas materyali — gerçekçi, hafif dokulu
  function mat(k){
    var m=new THREE.MeshStandardMaterial({
      color:R[k],roughness:0.55,metalness:0.04 });
    return m;
  }

  // Yumuşak elipsoid (skala ile gerçek kas şişkinliği)
  function topa(base,rx,ry,rz,r,k,extras){
    var geo=new THREE.SphereGeometry(r,36,28);
    var m=new THREE.Mesh(geo,mat(k));
    m.position.set(base[0],base[1],base[2]);m.scale.set(rx,ry,rz);
    m.castShadow=true;m.receiveShadow=true;
    m.userData.kas=k;m.userData.base=base.slice();
    m.userData.yon=(kaslar.find(q=>q.k===k&&q.ac)||{ac:0});
    if(extras){m.userData.yon=(kaslar.find(q=>q.k===k&&q.ac)||{ac:0});}
    group.add(m);return m;
  }

  // Yumuşak kapsül: iki nokta arası konik+silindirik kas (bacak/kol)
  function silin(a,b,rR,rT,k,rot){
    var dir=new THREE.Vector3().subVectors(b,a);var len=dir.length();
    var geo=new THREE.CylinderGeometry(rT,rR,len,30,1,true);
    var m=new THREE.Mesh(geo,mat(k));
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
    if(rot)m.rotateZ(rot);
    m.castShadow=true;m.receiveShadow=true;m.userData.kas=k;
    var mid=new THREE.Vector3().copy(a).add(b).multiplyScalar(0.5);
    m.userData.base=[mid.x,mid.y,mid.z];
    m.userData.yon=(kaslar.find(q=>q.k===k&&q.ac)||{ac:0});
    group.add(m);return m;
  }

  // Yumuşak, köşeleri kavisli gövde bloğu (kutu yerine yuvarlatılmış)
  function govde(base,sx,sy,sz,k,rot){
    // Yüksek segmentli kutu + hafif şişkinlik için Vertex değişimi
    var geo=new THREE.BoxGeometry(sx,sy,sz,8,8,8);
    // Köşeleri yumuşat: her tepeyi yüzeye göre hafifçe dışarı it
    var pos=geo.attributes.position;
    for(var i=0;i<pos.count;i++){
      var x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
      // Merkezden uzaklığa göre hafif bombeli yap
      var bump=0.06;
      pos.setX(i,x+x*Math.abs(x)/(sx)*bump);
      pos.setY(i,y+y*Math.abs(y)/(sy)*bump);
      pos.setZ(i,z+z*Math.abs(z)/(sz)*bump);
    }
    geo.computeVertexNormals();
    var m=new THREE.Mesh(geo,mat(k));
    m.position.set(base[0],base[1],base[2]);
    if(rot){m.rotation.set(rot[0]||0,rot[1]||0,rot[2]||0);}
    m.castShadow=true;m.receiveShadow=true;m.userData.kas=k;
    m.userData.base=base.slice();m.userData.yon=(kaslar.find(q=>q.k===k&&q.ac)||{ac:0});
    group.add(m);return m;
  }

  // ============ Kasları çiz (organik elipsoidler) ============
  // Boyun + trapez
  topa([0,1.34,0],0.55,0.5,0.5,0.16,'neck');
  govde([0,1.12,0.04],0.78,0.30,0.60,'traps',[0.12,0,0]);
  // Göğüs — iki yuvarlak pektoral + alt pektoral
  topa([-0.26,0.62,0.10],0.58,0.46,0.30,0.55,'chestL',[0,0,0.2]);
  topa([0.26,0.62,0.10],0.58,0.46,0.30,0.55,'chestU',[0,0,0.2]);
  govde([0,0.42,0.15],0.92,0.16,0.28,'chestLower',[0,0,0.10]);
  // Karın — yuvarlak üst/alt paketler
  topa([0,0.26,0.18],0.30,0.22,0.16,0.40,'absU');
  topa([0,0.14,0.18],0.28,0.20,0.16,0.38,'absL');
  topa([-0.32,0.16,0.14],0.24,0.28,0.16,0.42,'obliques',[0,0,0.2]);
  topa([0.32,0.16,0.14],0.24,0.28,0.16,0.42,'obliques',[0,0,0.2]);
  // Omuzlar — yuvarlak deltoid
  topa([-0.46,1.10,0.05],0.46,0.32,0.42,0.32,'shoulders');
  topa([0.46,1.10,0.05],0.46,0.32,0.42,0.32,'shoulders');
  // Kollar — kapsül kaslar
  silin([-0.62,1.02,0.04],[-0.82,0.48,0.02],0.15,0.13,'biceps',0.15);
  silin([0.62,1.02,0.04],[0.82,0.48,0.02],0.15,0.13,'biceps',-0.15);
  silin([-0.60,1.02,-0.07],[-0.80,0.48,-0.05],0.13,0.11,'triceps',0.15);
  silin([0.60,1.02,-0.07],[0.80,0.48,-0.05],0.13,0.11,'triceps',-0.15);
  silin([-0.70,0.72,0.06],[-0.82,0.52,0.05],0.06,0.05,'brachialis',0.15);
  silin([0.70,0.72,0.06],[0.82,0.52,0.05],0.06,0.05,'brachialis',-0.15);
  silin([-0.84,0.46,0],[-0.96,-0.05,0],0.10,0.08,'forearms');
  silin([0.84,0.46,0],[0.96,-0.05,0],0.10,0.08,'forearms');
  // Bacaklar — güçlü kuadriseps, hamstring, baldır
  silin([-0.28,-0.30,0.05],[-0.28,-1.00,0.02],0.22,0.17,'quadriceps');
  silin([0.28,-0.30,0.05],[0.28,-1.00,0.02],0.22,0.17,'quadriceps');
  silin([-0.28,-0.30,-0.07],[-0.28,-1.00,-0.04],0.16,0.13,'hamstrings');
  silin([0.28,-0.30,-0.07],[0.28,-1.00,-0.04],0.16,0.13,'hamstrings');
  silin([-0.28,-1.03,0],[-0.28,-1.62,0],0.12,0.10,'calves');
  silin([0.28,-1.03,0],[0.28,-1.62,0],0.12,0.10,'calves');
  silin([-0.40,-0.40,0.06],[-0.46,-0.72,0.02],0.09,0.07,'abductors');
  silin([0.40,-0.40,0.06],[0.46,-0.72,0.02],0.09,0.07,'abductors');
  silin([-0.12,-0.42,0.12],[-0.12,-0.95,0.06],0.10,0.08,'adductors');
  silin([0.12,-0.42,0.12],[0.12,-0.95,0.06],0.10,0.08,'adductors');
  // Kalça — yuvarlak glute
  govde([0,-0.32,0.02],0.94,0.30,0.58,'glutes',[0.06,0,0]);
  topa([-0.30,-0.32,0.05],0.36,0.24,0.34,0.22,'gluteM');
  topa([0.30,-0.32,0.05],0.36,0.24,0.34,0.22,'gluteM');
  // Sırt
  govde([0,0.58,-0.26],0.98,0.88,0.18,'lats',[0,0,0.04]);
  govde([0,0.14,-0.26],0.86,0.54,0.16,'middle back',[0,0,0.04]);
  govde([0,-0.10,-0.26],0.82,0.34,0.16,'lower back',[0,0,0.04]);

  // Kafa (görsel)
  var kafa=new THREE.Mesh(new THREE.SphereGeometry(0.29,36,28),
    new THREE.MeshStandardMaterial({color:0xDEB087,roughness:0.5}));
  kafa.position.y=1.55;kafa.castShadow=true;group.add(kafa);

  // Zemin — yumuşak gölge alanı (sahne dışında)
  var zemin=new THREE.Mesh(new THREE.CircleGeometry(3,64),
    new THREE.MeshStandardMaterial({color:0x14171d,roughness:0.95}));
  zemin.rotation.x=-Math.PI/2;zemin.position.y=-1.70;zemin.receiveShadow=true;scene.add(zemin);

  group.rotation.x=0.04;

  // Lejant
  var lg=document.getElementById('legends');
  Object.keys(R).forEach(function(k){
    var d=document.createElement('div');d.className='lg';
    d.innerHTML='<div class="sw" style="background:#'+k.toString(16).padStart(6,'0')+'"></div>'+TR[k];
    lg.appendChild(d);
  });

  // ============ Ayrık görünüm ============
  var meshList=[];group.traverse(function(o){if(o.isMesh&&o.userData.kas)meshList.push(o);});
  meshList.forEach(function(m){
    var entry=null;
    var bd=m.userData.base;
    kaslar.forEach(function(kk){ if(!entry&&kk.base[0]===bd[0]&&Math.abs(kk.base[1]-bd[1])<0.05&&Math.abs(kk.base[2]-bd[2])<0.05)entry=kk; });
    if(!entry){kaslar.forEach(function(kk){if(!entry&&kk.k===m.userData.kas)entry=kk;});}
    m.userData.ayik=entry?entry.yon:[0,0,0];
    m.userData.ac = entry?entry.ac:0.3;
  });

  function ayrıkUygula2(){
    meshList.forEach(function(m){
      if(ayrik){
        var y=m.userData.ayik, a=m.userData.ac;
        m.position.set(m.userData.base[0]+y[0]*a, m.userData.base[1]+y[1]*a, m.userData.base[2]+y[2]*a);
      }else{
        m.position.set(m.userData.base[0],m.userData.base[1],m.userData.base[2]);
      }
    });
  }

  document.getElementById('btnAyrık').addEventListener('click',function(){
    ayrik=!ayrik;this.classList.toggle('aktif',ayrik);
    this.textContent=ayrik?'🧩 Birleştir':'🧩 Kasları Ayır';
    ayrıkUygula2();
  });

  function setGorunum(v){
    gorunum=v;
    document.getElementById('btnOn').classList.toggle('aktif',v==='on');
    document.getElementById('btnArka').classList.toggle('aktif',v==='arka');
    if(v==='on'){group.rotation.y=0;}else{group.rotation.y=Math.PI;}
  }
  document.getElementById('btnOn').addEventListener('click',function(){setGorunum('on');});
  document.getElementById('btnArka').addEventListener('click',function(){setGorunum('arka');});
  setGorunum('on');

  // Orbit (elle)
  var aktif=false,x=0,y=0,teker=6.2, el=renderer.domElement;
  el.addEventListener('touchstart',function(e){if(e.touches.length===1){aktif=true;x=e.touches[0].clientX;y=e.touches[0].clientY;}else if(e.touches.length>=2){aktif=false;}},{passive:true});
  el.addEventListener('touchmove',function(e){if(aktif&&e.touches.length===1){group.rotation.y+=(e.touches[0].clientX-x)*0.012;group.rotation.x=Math.max(-0.6,Math.min(0.9,group.rotation.x+(e.touches[0].clientY-y)*0.012));x=e.touches[0].clientX;y=e.touches[0].clientY;}},{passive:true});
  el.addEventListener('touchend',function(){aktif=false;},{passive:true});
  el.addEventListener('wheel',function(e){teker=Math.max(3.2,Math.min(10,teker+e.deltaY*0.005));},{passive:true});

  // Raycast
  var raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
  function dokun(cx,cy){var rect=el.getBoundingClientRect();
    pointer.x=((cx-rect.left)/rect.width)*2-1;pointer.y=-(((cy-rect.top)/rect.height)*2-1);
    raycaster.setFromCamera(pointer,camera);
    var ms=[];group.traverse(function(o){if(o.isMesh&&o.userData.kas)ms.push(o);});
    var h=raycaster.intersectObjects(ms,false);
    if(h.length>0)sec(h[0].object.userData.kas);}
  el.addEventListener('click',function(e){if(e.clientX!==undefined)dokun(e.clientX,e.clientY);});

  function sec(kod){
    if(secili){secili.material.color.setHex(secili._renk);secili.material.emissive.setHex(0x000000);}
    oklar.forEach(function(o){group.remove(o);});oklar=[];
    var hedef=null;group.traverse(function(o){if(o.isMesh&&o.userData.kas===kod&&!hedef)hedef=o;});
    if(!hedef)return;
    hedef._renk=hedef.material.color.getHex();hedef.material.color.setHex(0xFF5252);hedef.material.emissive.setHex(0x551111);
    secili=hedef;
    var n=new THREE.Mesh(new THREE.SphereGeometry(0.06,16,12),new THREE.MeshBasicMaterial({color:0xFFD54A}));
    n.position.copy(hedef.position);n.position.x+=0.28;group.add(n);oklar.push(n);
    kasSecildi(kod,TR[kod]||kod);
  }

  // Otomatik yavaş dönüş
  var oto=true;
  el.addEventListener('touchstart',function(){oto=false;},{passive:true});
  el.addEventListener('click',function(){oto=false;});
  document.getElementById('btnAyrık').addEventListener('click',function(){oto=false;});
  function anim(){requestAnimationFrame(anim);
    if(oto){group.rotation.y+=0.004;}
    camera.position.z=teker;camera.lookAt(0,0.4,0);renderer.render(scene,camera);}
  anim();
  window.addEventListener('resize',function(){w=window.innerWidth;h=window.innerHeight;
