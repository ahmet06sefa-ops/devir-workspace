# Düşük bellekli sandbox (~1.9 GB RAM) için ayarlandı
org.gradle.jvmargs=-Xmx1100m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=false
# Kotlin derleyicisini Gradle süreci içinde çalıştır (ayrı 2GB daemon açmasın)
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx700m

# v5.7: dex birleştirmede bellek tasarrufu
android.enableR8.fullMode=false
# v6.7: PdfBox büyük kütüphane — dex adımında bellek tasarrufu
android.useFullClasspathForDexingTransform=true

# v7.34: dex birleştirmeyi ayrı süreçte, sınırlı bellekle çalıştır (OOM önlemi)
android.dexingArtifactTransform.desugaring=false

# v7.41: dex adımı sürekli OOM oluyordu — çalışanları ayrı süreçte,
# sınırlı heap ile çalıştır. Gradle ana süreci böylece rahatlar.
org.gradle.workers.max=1
android.experimental.enableArtProfiles=false
